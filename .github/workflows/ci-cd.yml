name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run per branch at a time; a new push cancels the previous run.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (lint + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v

  build:
    name: Build and push image (GHCR)
    needs: test
    # Build/deploy only on push to main or manual dispatch (not on PRs).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Define image name (owner in lowercase)
        id: vars
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=ghcr.io/${OWNER}/ru-ometro" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER}/ru-ometro:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.vars.outputs.repo) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image
        run: echo "Imagem publicada -> ${{ steps.vars.outputs.image }}"

  deploy-k8s:
    name: Deploy to Kubernetes (kind)
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ru-ometro

      - name: Set image tag (kustomize)
        run: |
          cd k8s
          kustomize edit set image ru-ometro="$IMAGE"
          cat kustomization.yaml

      - name: Apply manifests
        run: kubectl apply -k k8s/

      - name: Wait for rollout
        run: kubectl -n ru-ometro rollout status deploy/ru-ometro --timeout=120s

      - name: Smoke test (/health + version)
        run: |
          kubectl -n ru-ometro port-forward svc/ru-ometro 8080:80 &
          for i in $(seq 1 10); do
            if RESPONSE=$(curl -sf http://localhost:8080/health); then break; fi
            echo "Tentativa $i falhou, aguardando..."; sleep 3
          done
          echo "Resposta: $RESPONSE"
          echo "$RESPONSE" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .version == $sha'
          echo "Deploy no K8s OK: versão no ar = $GITHUB_SHA"

      - name: Show resources
        run: kubectl -n ru-ometro get all

      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n ru-ometro describe deploy,pods
          kubectl -n ru-ometro logs -l app.kubernetes.io/name=ru-ometro --tail=100

  deploy-nomad:
    name: Deploy to Nomad (dev agent)
    needs: build   # runs in parallel with deploy-k8s
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      NOMAD_VERSION: "1.9.3"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nomad
        run: |
          # Unzip outside the repo: the checkout already has a "nomad/" folder
          cd "$RUNNER_TEMP"
          curl -sfLo nomad.zip "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          unzip -q nomad.zip
          sudo mv nomad /usr/local/bin/
          nomad version

      - name: Start ephemeral Nomad agent (dev mode)
        run: |
          sudo nomad agent -dev -bind 0.0.0.0 > nomad.log 2>&1 &
          for i in $(seq 1 30); do
            if nomad node status 2>/dev/null | grep -q ready; then break; fi
            echo "Aguardando o Nomad ($i)..."; sleep 2
          done
          nomad node status

      - name: Validate job
        run: nomad job validate -var "image=$IMAGE" nomad/ru-ometro.nomad.hcl

      - name: Run job (waits for healthy deployment)
        run: nomad job run -var "image=$IMAGE" nomad/ru-ometro.nomad.hcl

      - name: Smoke test (/health + version)
        run: |
          for i in $(seq 1 10); do
            if RESPONSE=$(curl -sf http://localhost:8080/health); then break; fi
            echo "Tentativa $i falhou, aguardando..."; sleep 3
          done
          echo "Resposta: $RESPONSE"
          echo "$RESPONSE" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .version == $sha'
          echo "Deploy no Nomad OK: versão no ar = $GITHUB_SHA"

      - name: Show job status
        run: nomad job status ru-ometro

      - name: Debug on failure
        if: failure()
        run: |
          set +e
          nomad job status ru-ometro
          ALLOC=$(nomad job allocs -t '{{range .}}{{.ID}}{{end}}' ru-ometro 2>/dev/null | head -c 36)
          if [ -n "$ALLOC" ]; then
            nomad alloc status "$ALLOC"
            nomad alloc logs -stderr "$ALLOC" api
          fi
          tail -50 nomad.log
          exit 0
