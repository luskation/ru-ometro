apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ru-ometro

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# The pipeline runs "kustomize edit set image ru-ometro=<image>" to fill this in.
images:
  - name: ru-ometro
    newName: ru-ometro
    newTag: local
