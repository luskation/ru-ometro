apiVersion: apps/v1
kind: Deployment
metadata:
  name: ru-ometro
  labels:
    app.kubernetes.io/name: ru-ometro
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below 2 ready pods during an update
      maxSurge: 1         # create 1 extra pod at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: ru-ometro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ru-ometro
    spec:
      containers:
        - name: api
          image: ru-ometro   # replaced by kustomize with ghcr.io/<owner>/ru-ometro:<sha>
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ru-ometro-config
          readinessProbe:     # only receives traffic when /health answers
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:      # restarts the container if it stops answering
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
